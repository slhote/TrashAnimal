[project]
name = "multi-agent-review"
version = "0.1.0"
description = "LangGraph orchestration of the TrashAnimal specialist code reviewers"
requires-python = ">=3.14.8"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "claude-agent-sdk>=0.2",
    "pydantic>=2.13",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
